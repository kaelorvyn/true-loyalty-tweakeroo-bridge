plugins {
    id 'fabric-loom' version '1.16.3'
}

version = '1.0.0'
group = 'com.bloodsoil'

base {
    archivesName = 'TrueLoyalty-Tweakeroo-Bridge'
}

repositories {
    maven {
        url = 'https://maven.aliyun.com/repository/central'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation files("D:/MC/.minecraft/versions/1.21.11-Fabric 0.19.3/mods/tweakeroo-fabric-1.21.11-0.27.10.jar")
    modImplementation files("D:/MC/.minecraft/versions/1.21.11-Fabric 0.19.3/mods/malilib-fabric-1.21.11-0.27.13.jar")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
